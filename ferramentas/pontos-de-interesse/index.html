<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Pontos de Interesse</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap">
<style id="appcss">
:root{
  --bg:#1f1f1f; --panel:#1c1b20; --panel2:#26242b; --line:#37333d;
  --txt:#eae6e2; --muted:#9c95a2; --blood:#b3372c; --blood-hi:#d1483c;
  --paper:#ffffff; --note:#cfd2d4;
  --radius:3px;
  --f-disp:"Oswald","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Roboto","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blood-hi);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.voltar{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);
  color:var(--muted);text-decoration:none;font-size:15px;line-height:1}
.voltar:hover{color:var(--txt);border-color:#4a4553;background:#302d37}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:6px}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.09em;text-transform:uppercase}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tb{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel2);font-size:13px;letter-spacing:.02em;transition:border-color .12s,background .12s}
.tb:hover{background:#302d37;border-color:#4a4553}
.tb.pri{background:var(--blood);border-color:var(--blood)}
.tb.pri:hover{background:var(--blood-hi)}
.tb.on{background:#efe9df;color:#1b191d;border-color:#efe9df}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}

/* ---------- area dos cartoes ---------- */
main{padding:34px 24px 140px;display:flex;flex-direction:column;align-items:center;
  align-items:safe center;gap:34px}
/* ampliacao so para editar: zoom refaz o layout na escala, entao o texto
   continua nitido e o cartao segue com 720px de largura de verdade —
   a quebra de linha e a exportacao nao mudam */
main{zoom:var(--zoom,1)}
.zoomctl{display:flex;align-items:center;gap:4px}
.zoomctl .tb{padding:6px 11px;font-family:var(--f-mono);line-height:1}
#zoomval{min-width:48px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wrap{width:720px;position:relative}
.card{background:var(--paper);color:#111;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.45);font-family:var(--f-body);font-size:15px}
.empty{color:var(--muted);text-align:center;font-size:14px;line-height:1.7;padding:60px 0}

.card-tools{position:absolute;top:-15px;right:-3px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:20}
.wrap:hover .card-tools,.card-tools:focus-within{opacity:1}
.ct{width:26px;height:26px;display:grid;place-items:center;background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:var(--radius);font-size:13px;line-height:1}
.ct:hover{background:var(--blood);border-color:var(--blood)}

/* ---------- cabecalho do cartao ---------- */
.head{background:var(--head,#111);color:#fff;display:flex;align-items:stretch}
.head-ico{flex:0 0 auto;display:grid;place-items:center;padding:0 2px 0 11px;line-height:1}
.head-ico .ico{width:22px;height:22px}
svg.ico{display:inline-block;vertical-align:middle}
.ml-title .ico.em-titulo{width:14px;height:14px;margin-right:3px;vertical-align:-2px}
.lock .ico{width:11px;height:11px;vertical-align:-1px}
.opt.icones button{padding:5px 7px;line-height:0}
.opt.icones .ico{width:17px;height:17px}
.opt.icones button.on .ico{color:#1b191d}
.head-txt{flex:1 1 auto;padding:9px 12px 10px 11px;min-width:0}
.head-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.tt{margin:0;font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.045em;text-transform:uppercase;line-height:1.16}
.ktag{font-family:var(--f-disp);font-weight:600;font-size:12.5px;letter-spacing:.07em;color:#ffd24a;text-transform:uppercase;white-space:nowrap}
.head-desc{font-size:13.5px;line-height:1.42;margin-top:2px;color:#f3f0ec;font-style:italic}
.head-num{flex:0 0 auto;display:grid;place-items:center;min-width:48px;padding:0 8px;background:rgba(255,255,255,.14);
  font-family:var(--f-disp);font-weight:700;font-size:23px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
body.edit .head-num .ed{min-width:1.4em;text-align:center}

/* ---------- faixas ---------- */
.banner{background:var(--v,#111);text-align:center;padding:4px 10px;
  font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:6px;border-bottom: 1px solid #111;border-top: 1px solid #111;}
.textblk{padding:9px 13px;font-size:13.5px;line-height:1.46;background:var(--v,#fff)}

/* ---------- tabelas ---------- */
/* separate + spacing 0: as divisas sao pintadas por cada celula, e nao pela
   tabela. Com border-collapse o Firefox esconde os fios, porque cada <tr> e
   position:relative (ancora da calha de +/-) e passa a pintar por cima. */
table.t{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.t th{background:#cfd2d4;color:#111;text-align:left;padding:4px 9px;
  font-family:var(--f-disp);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.t tr{position:relative}
.t td{padding:6px 9px;vertical-align:top;font-size:13.4px;line-height:1.42}

table.t{border-top:1px solid #111;border-bottom:1px solid #111;}
.t th,.t td{border-right:1px solid #111;border-bottom:1px solid #111; vertical-align: middle;}
.t th:last-child,.t td:last-child{border-right:0}
.t tr:last-child td,.t td.nb{border-bottom:0}
.t td.k{font-weight:500;background:var(--k,#c9c9c9)}
.t td.dt{text-align:center;font-weight:700;background:var(--k,#c9c9c9);font-variant-numeric:tabular-nums}
.t td.v{background:var(--v,#e6e6e6)}
.t td.mono{font-family:var(--f-mono);font-size:12.2px;line-height:1.46}
.lock{font-size:11px;opacity:.8;margin-left:3px;vertical-align:1px}

/* Quadro de mecanica: nos modulos o bloco inteiro tem um tom so, com o
   texto em preto e as divisas separando rotulo, cabecalho e linhas. */
.t.mech td{background:var(--m,#d2886c)}
.t.mech td.mh{font-family:var(--f-disp);font-weight:600;font-size:12.5px;
  letter-spacing:.06em;text-transform:uppercase}
.t.mech td.mv{font-weight:500}
.t.mech td.mtexto{font-weight:400;padding:9px 11px}
td.mlabel{padding:8px 10px;vertical-align:top}
.ml-title{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.045em;text-transform:uppercase;line-height:1.22}
.ml-sep{opacity:.8;margin:0 2px}
.ml-tag{display:inline-block;background:#111;color:#fff;padding:1px 6px;margin-top:4px;
  font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.ml-note{font-size:11.5px;line-height:1.34;margin-top:4px;opacity:.85}

/* ---------- descricao contextual ---------- */
.note{background:var(--note);display:grid;grid-template-columns:52px 1fr;align-items:center;padding:11px 13px 12px 6px}
.note .ico{display:grid;place-items:start center;padding-top:2px}
.note svg{width:31px;height:31px;color:#1c1a18}
.note .body{font-size:13px;line-height:1.5}

/* ---------- edicao ---------- */
.ed{outline:0;min-height:1em;white-space:pre-wrap;overflow-wrap:break-word}
body.edit .ed:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
body.edit .head .ed:hover,body.edit .banner .ed:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
body.edit .ed:focus{box-shadow:inset 0 0 0 2px var(--blood-hi);background:rgba(179,55,44,.07)}
body.edit span.ed{display:inline-block;}
.ed:empty::before{content:attr(data-ph);color:#8d8d8d;font-style:italic}
.head .ed:empty::before,.banner .ed:empty::before{color:rgba(255,255,255,.45)}
/* o realce e sempre claro, entao o texto dentro dele vai de preto — se
   herdasse a cor, um realce dentro do cabecalho sairia branco no claro */
mark{background:#bde06a;color:#111;padding:0 2px}
#fmt{position:absolute;z-index:210;display:none;align-items:center;gap:4px;padding:5px 6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 10px 26px rgba(0,0,0,.55)}
#fmt.on{display:flex}
#fmt button{min-width:26px;height:24px;padding:0 6px;border:1px solid transparent;
  border-radius:2px;font-size:13px;line-height:1;color:var(--txt)}
#fmt button:hover{background:#3a3642;border-color:#4a4553}
#fmt .fmt-cor{width:20px;height:20px;min-width:0;padding:0;border:1px solid rgba(0,0,0,.4)}
#fmt .fmt-txt{width:20px;height:20px;min-width:0;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
#fmt .sw-livre.redondo{border-radius:50%}
#fmt .fmt-rot{font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;color:var(--muted);padding:0 1px}
#fmt .fmt-sep{width:1px;height:18px;background:var(--line);margin:0 2px}
#fmt .sw-livre{width:20px;height:20px;border-width:1px;border-color:rgba(0,0,0,.4)}

.gutter{position:absolute;left:-64px;top:2px;display:flex;gap:2px;opacity:0;transition:opacity .1s}
tr:hover .gutter,.gutter:focus-within{opacity:1}
.g{width:18px;height:18px;display:grid;place-items:center;border-radius:2px;background:#2a2830;color:#ded9e2;
  border:1px solid #423d4b;font-size:12px;line-height:1;font-family:var(--f-mono);padding:0}
.g:hover{background:var(--blood);border-color:var(--blood);color:#fff}
.addrow button{padding:3px 10px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-family:var(--f-disp);color:#6b6b6b;background:#f4f4f4;border-top:1px dashed #c7c7c7;width:100%;text-align:left}
.addrow button:hover{background:#e9e9e9;color:#111}

.blk{position:relative}
.blk-tools{position:absolute;right:-38px;top:0;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .1s}
.blk:hover .blk-tools,.blk-tools:focus-within{opacity:1}

.addblk{display:flex;gap:6px;flex-wrap:wrap;padding:9px 0 0}
.addblk button{padding:4px 10px;border:1px dashed #4a4553;border-radius:var(--radius);color:var(--muted);
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-disp)}
.addblk button:hover{color:var(--txt);border-color:var(--blood-hi);border-style:solid}

/* ---------- popover ---------- */
#pop{position:absolute;z-index:200;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 12px 30px rgba(0,0,0,.55);padding:11px;display:none;width:272px}
#pop.open{display:block}
#pop h4{margin:0 0 6px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
#pop h4+*{margin-bottom:11px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw-btn{width:26px;height:22px;border-radius:2px;border:2px solid transparent}
.sw-btn.sel{border-color:#fff}
/* quadrado de cor livre: o input cobre o quadrado inteiro, invisivel */
.sw-livre{position:relative;display:inline-block;width:26px;height:22px;border-radius:2px;
  border:2px solid transparent;overflow:hidden;cursor:pointer;
  background:conic-gradient(#e05b4a,#e8c33e,#63b357,#4a8ad0,#9a5bd0,#e05b4a)}
.sw-livre.sel{border-color:#fff}
.sw-livre input{position:absolute;left:-8px;top:-8px;width:calc(100% + 16px);height:calc(100% + 16px);
  padding:0;border:0;background:transparent;opacity:0;cursor:pointer}
.opt{display:flex;gap:5px;flex-wrap:wrap}
.opt button{padding:4px 8px;font-size:12px;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
.opt button:hover{border-color:var(--blood-hi)}
.opt button.on{background:#efe9df;color:#1b191d;border-color:#efe9df}
.skills{display:flex;gap:4px;flex-wrap:wrap;max-height:186px;overflow:auto}
.skills button{padding:2px 6px;font-size:11.5px;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
.skills button:hover{background:var(--blood);border-color:var(--blood)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:300;background:rgba(8,7,10,.78);display:none;place-items:center;padding:24px}
#modal.open{display:grid}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:20px;width:min(660px,100%);max-height:84vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-family:var(--f-disp);font-size:17px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.55}
.sheet textarea{width:100%;height:210px;background:#131217;color:var(--txt);border:1px solid var(--line);
  border-radius:3px;padding:10px;font-family:var(--f-mono);font-size:12px;line-height:1.5;resize:vertical}
.sheet h4{margin:14px 0 7px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:400;background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:9px 16px;font-size:13px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
.sheet ul{margin:0 0 14px;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.8}
.sheet li b{color:var(--txt);font-weight:500}
kbd{background:#131217;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
  padding:1px 5px;font-family:var(--f-mono);font-size:11.5px;color:var(--txt)}
code{font-family:var(--f-mono);font-size:12px;background:#131217;padding:1px 5px;border-radius:2px;color:#e6c98a}
.tpl{display:grid;gap:8px}
.tpl button{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:var(--panel2)}
.tpl button:hover{border-color:var(--blood-hi)}
.tpl b{display:block;font-family:var(--f-disp);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tpl span{font-size:12.5px;color:var(--muted)}

/* ---------- modo mesa ---------- */
/* Modo mesa: cada cartao encaixa centralizado ao rolar. O encaixe e
   "proximity", e nao "mandatory", entao rolar dentro de um cartao alto
   continua livre; alem disso, cartao mais alto que a tela encaixa pelo
   topo (.alto), para dar para ler do comeco. */
body.read .wrap{scroll-snap-align:center}
body.read .wrap.alto{scroll-snap-align:start}
body.read .card-tools,body.read .blk-tools,body.read .gutter,body.read .addrow,body.read .addblk{display:none!important}
body.read .wrap{padding-left:0}

/* ---------- impressao ---------- */
@media print{
  @page{margin:12mm}
  body{background:#fff}
  .topbar,#pop,#modal,.card-tools,.blk-tools,.gutter,.addrow,.addblk{display:none!important}
  main{padding:0;gap:10mm}
  .wrap{padding-left:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
}
@media (max-width:840px){
  .gutter{left:-23px;flex-direction:column}
  .blk-tools{right:-21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ==========================================================================
   PONTOS DE INTERESSE — editor de cartoes para mesas de Ordem Paranormal
   Arquivo unico, sem dependencias. Os dados ficam no localStorage do navegador.
   ========================================================================== */

/* ---------- paleta das linhas (igual a dos modulos oficiais) ---------- */
const COLORS = {
  verde:   {n:"Verde",   k:"#b5d489", v:"#d9e9c0"},
  azul:    {n:"Azul",    k:"#a3c8e9", v:"#d3e3f5"},
  ciano:   {n:"Ciano",   k:"#a7d5d0", v:"#d6eae7"},
  pessego: {n:"Pêssego", k:"#f2c79a", v:"#fae0c8"},
  amarelo: {n:"Amarelo", k:"#edd98a", v:"#f7eec2"},
  roxo:    {n:"Roxo",    k:"#c3a9dc", v:"#e2d5ef"},
  salmao:  {n:"Salmão",  k:"#f0b8ab", v:"#f9dcd4"},
  terracota:{n:"Terracota", k:"#d2886c", v:"#e2a68e"},
  cinza:   {n:"Cinza",   k:"#c9c9c9", v:"#e6e6e6"}
};
const CKEYS = Object.keys(COLORS);

/* Cor pode ser uma chave da paleta ("verde") ou um hex livre escolhido no
   seletor. tinta() devolve sempre {k, v}: o tom cheio e uma versao clara para
   a celula de informacao. */
const hexOk = v => /^#[0-9a-f]{6}$/i.test(String(v || ""));
function clarear(hex, q){
  const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * q);
  return "#" + [m(n >> 16), m((n >> 8) & 255), m(n & 255)].map(c => c.toString(16).padStart(2, "0")).join("");
}
function tinta(v){
  if (COLORS[v]) return COLORS[v];
  if (hexOk(v)) return {n: v, k: v, v: clarear(v, 0.45)};
  return COLORS.cinza;
}
/* Texto preto ou branco conforme o fundo. O corte em 0,179 e o ponto em que o
   preto passa a contrastar melhor que o branco (relacao de luminancia WCAG). */
function luz(hex){
  if (!hexOk(hex)) return 1;
  const n = parseInt(hex.slice(1), 16);
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(n >> 16) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
}
const contraste = hex => luz(hex) > 0.179 ? "#111111" : "#ffffff";
const ACCENTS = [
  ["#111111","Preto"],["#6a3f9e","Roxo"],["#c1642a","Laranja"],
  ["#3f7f4a","Verde"],["#2d5f96","Azul"],["#a8322a","Vermelho"]
];
/* Icones em SVG: emoji muda de desenho (e de cor) conforme o sistema, e o
   cartao precisa sair igual na tela, na impressao e na imagem exportada. */
const ICONES = {
  lupa:    '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 5.1 5.1"/>',

/* marcacao inline estilo Markdown, aplicada no Modo mesa e na impressao */
function md(s){
  return esc(s)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/==([^=\n]+)==/g, "<mark>$1</mark>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
}
const P = (ci, bi, ri) => ' data-ci="' + ci + '"' +

/* ---------- texto formatado ----------
   Os campos guardam HTML restrito: <b>, <i>, <u> e <mark> (com a cor do realce
   no style), mais "\n" para quebra de linha. Tudo o que entra passa por
   sanitiza(): o que o navegador produzir no contenteditable — spans com estilo,
   divs de Enter, sujeira colada — vira essa forma enxuta, e nada mais chega ao
   estado nem ao SVG exportado. */
const TAG_B = {B:1, STRONG:1}, TAG_I = {I:1, EM:1};
function corHex(css){
  const t = String(css || "").trim();
  if (hexOk(t)) return t.toLowerCase();
  const m = t.match(/rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)(?:[\s,/]+([\d.]+))?/);
  if (!m || (m[4] !== undefined && parseFloat(m[4]) === 0)) return "";
  return "#" + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, "0")).join("");
}
function limpaNos(no){
  let out = "";
  no.childNodes.forEach(n => {
    if (n.nodeType === 3){ out += esc(n.nodeValue); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName;
    if (tag === "BR"){ out += "\n"; return; }
    const dentro = limpaNos(n);
    if (TAG_B[tag]) { out += dentro.trim() ? "<b>" + dentro + "</b>" : dentro; return; }
    if (TAG_I[tag]) { out += dentro.trim() ? "<i>" + dentro + "</i>" : dentro; return; }
    if (tag === "U")  { out += dentro.trim() ? "<u>" + dentro + "</u>" : dentro; return; }
    if (tag === "MARK" || tag === "SPAN" || tag === "FONT"){
      const est = n.style || {};
      const bg = corHex(est.backgroundColor || (tag === "MARK" && !est.background ? "#bde06a" : est.background));
      const fg = corHex(est.color || (tag === "FONT" ? n.getAttribute("color") : ""));
      let s = dentro;
      if (est.fontWeight === "bold" || +est.fontWeight >= 600) s = "<b>" + s + "</b>";
      if (est.fontStyle === "italic") s = "<i>" + s + "</i>";
      if (est.textDecorationLine === "underline") s = "<u>" + s + "</u>";
      if (s.trim()){
        if (bg) s = '<mark style="background:' + bg + (fg ? ";color:" + fg : "") + '">' + s + "</mark>";
        else if (fg) s = '<span style="color:' + fg + '">' + s + "</span>";
      }
      out += s;
      return;
    }
    if (tag === "DIV" || tag === "P" || tag === "LI"){
      out += (out && !/\n$/.test(out) ? "\n" : "") + dentro;
      return;
    }
    out += dentro;
  });
  return out;
}
function sanitiza(html){
  const cx = document.createElement("div");
  cx.innerHTML = String(html == null ? "" : html);
  return limpaNos(cx).replace(/\n+$/, "");
}
/* conteudo antigo era texto puro com marcacao **negrito**, *italico* e ==realce== */
const rico = v => { v = String(v == null ? "" : v); return v.indexOf("<") < 0 ? md(v) : v; };

/* campo editavel; guarda e mostra o HTML restrito */
function ed(tag, cls, path, field, val, ph){
  const open = "<" + tag + ' class="ed ' + (cls || "") + '"' + path + ' data-f="' + field + '"';
  const html = rico(val);
  if (state.mode === "read") return open + ">" + html + "</" + tag + ">";
  return open + ' contenteditable="true" data-ph="' + esc(ph || "") + '">' + html + "</" + tag + ">";
}

  return ed(tag, cls, path, field, val, ph);
}

/* --- bloco: tabela de pericias --- */
function skillsHTML(b, ci, bi){
  const spans = b.rows.map(() => 1);
  let head = -1;
  b.rows.forEach((r, i) => {
    if (r.cont && head >= 0) { spans[head]++; spans[i] = 0; } else { head = i; }
  });
  let h = '<table class="t"><colgroup><col style="width:18%"><col style="width:5%"><col></colgroup>';
  h += "<tr>" + b.h.map((t, i) => "<th>" + ed("span", "", P(ci, bi) + ' data-h="' + i + '"', "h" + i, t, "título") + "</th>").join("") + "</tr>";
  b.rows.forEach((r, ri) => {
    const col = tinta(r.c), path = P(ci, bi, ri);
    h += "<tr>";
    if (spans[ri] > 0)
      h += '<td class="k' + (ri + spans[ri] >= b.rows.length ? " nb" : "") + '" style="--k:' + col.k +
        '" rowspan="' + spans[ri] + '">' + gutter(path, col.k) +
        ed("span", "", path, "sk", r.sk, "Perícia") + lockMark(r.lock) + "</td>";
    h += '<td class="dt" style="--k:' + col.k + '">' + (spans[ri] > 0 ? "" : gutter(path, col.k)) +
      ed("div", "", path, "dt", r.dt, "DT") + "</td>";
    h += '<td class="v' + (r.mono ? " mono" : "") + '" style="--v:' + col.v + '">' +
      ed("div", "", path, "info", r.info, "O que o teste revela") + "</td>";
    h += "</tr>";
  });
  h += "</table>";
  return h;
}

/* --- bloco: mecanica (bloqueio / desafio de acesso) --- */
function mechHTML(b, ci, bi){
  const col = tinta(b.c), bp = P(ci, bi);
  const fundo = col.k, cor = contraste(fundo);
  const soTexto = b.modo === "texto";
  const temHead = !soTexto && (state.mode === "edit" || (b.h[0] + b.h[1]).trim() !== "");
  const linhas = [];
  if (temHead)
    linhas.push('<td class="mh">' + ed("span", "", bp + ' data-h="0"', "h0", b.h[0], "coluna") + "</td>" +
                '<td class="mh">' + ed("span", "", bp + ' data-h="1"', "h1", b.h[1], "coluna") + "</td>");
  if (soTexto){
    linhas.push('<td class="mtexto' + (b.mono ? " mono" : "") + '" colspan="2">' +
      ed("div", "", bp, "texto", b.texto, "As ações exigidas, os DTs e o que acontece se falhar") + "</td>");
  } else {
    b.rows.forEach((r, ri) => {
      const path = P(ci, bi, ri);
      /* linha inteira: um comando só, sem coluna de resultado (ex.: ARROMBAR — DT 12) */
      const inteira = r.full || (state.mode === "read" && !String(r.b || "").trim());
      linhas.push('<td class="mv' + (b.mono ? " mono" : "") + '"' + (inteira ? ' colspan="2"' : "") + ">" +
        gutter(path, fundo) + ed("div", "", path, "a", r.a, "condição") + "</td>" +
        (inteira ? "" : '<td class="mv' + (b.mono ? " mono" : "") + '">' +
          ed("div", "", path, "b", r.b, "resultado") + "</td>"));
    });
    if (!linhas.length) linhas.push('<td class="mv" colspan="2"></td>');
  }
  const rotulo = '<td class="mlabel nb" rowspan="' + linhas.length + '">' +
    '<div class="ml-title">' + icoSVG(b.ico, "em-titulo") +
      ed("span", "", bp, "title", b.title, "TÍTULO") +
      (state.mode === "edit" || b.sub ? '<span class="ml-sep">✦</span>' : "") +
      edOpt("span", "", bp, "sub", b.sub, "SUBTÍTULO") + "</div>" +
    (b.tag ? ed("div", "ml-tag", bp, "tag", b.tag, "ETIQUETA") : "") +
    (b.note ? ed("div", "ml-note", bp, "note", b.note, "Observação") : "") + "</td>";
  let h = '<table class="t mech" style="--m:' + fundo + ';color:' + cor + '">' +
    '<colgroup><col style="width:32%"><col style="width:20%"><col></colgroup>';
  linhas.forEach((l, i) => { h += "<tr>" + (i === 0 ? rotulo : "") + l + "</tr>"; });
  return h + "</table>";
}

function render(){
  /* seletor de cor livre: usa change (e nao input) para nao redesenhar o menu
   a cada arrastar do cursor dentro da paleta do sistema */
document.addEventListener("change", e => {
  const inp = e.target.closest && e.target.closest('input[type="color"][data-act]');
  if (!inp) return;
  const act = ACTIONS[inp.dataset.act];
  if (act) act(Object.assign({}, inp.dataset, {v: inp.value}), inp);
});

const deck = document.getElementById("deck");
  document.body.classList.remove("edit", "read");
  document.body.classList.add(state.mode);
  deck.innerHTML = state.cards.length
    ? state.cards.map(cardHTML).join("")
    : '<div class="empty">Nenhum cartão ainda.<br>Comece por <b>+ Novo cartão</b> ou escolha um <b>Modelo</b>.</div>';
  document.documentElement.style.setProperty("--zoom", zoomAtual());
  encaixe();
  document.getElementById("zoomval").textContent = Math.round(zoomAtual() * 100) + "%";
  const n = state.cards.length;
  document.getElementById("count").textContent = n + (n === 1 ? " cartão" : " cartões");
  document.getElementById("modeBtn").classList.toggle("on", state.mode === "read");
  document.getElementById("modeBtn").textContent = state.mode === "read" ? "Modo edição" : "Modo mesa";
  if (focusAfter){
    const sel = '[data-ci="' + focusAfter.ci + '"]' +
      (focusAfter.bi !== undefined ? '[data-bi="' + focusAfter.bi + '"]' : "") +
      (focusAfter.ri !== undefined ? '[data-ri="' + focusAfter.ri + '"]' : "") +
      '[data-f="' + focusAfter.f + '"]';
    const el = deck.querySelector(sel);
    if (el && el.isContentEditable){ el.focus(); placeCaretEnd(el); }
    focusAfter = null;
  }
}
/* liga o encaixe por cartao no modo mesa e marca os que nao cabem na tela */
function encaixe(){
  const raiz = document.documentElement, mesa = state.mode === "read";
  const barra = document.querySelector(".topbar");
  raiz.style.scrollSnapType = mesa ? "y proximity" : "";
  raiz.style.scrollPaddingTop = mesa ? ((barra ? barra.offsetHeight : 60) + 12) + "px" : "";
  if (!mesa) return;
  const teto = window.innerHeight * 0.9;
  document.querySelectorAll(".wrap").forEach(w => {
    w.classList.toggle("alto", w.getBoundingClientRect().height > teto);
  });
}
function placeCaretEnd(el){
  const r = document.createRange(), s = window.getSelection();
  r.selectNodeContents(el); r.collapse(false); s.removeAllRanges(); s.addRange(r);
}

function nodeOf(ds){
  const c = state.cards[+ds.ci];
  if (!c) return null;
  if (ds.bi === undefined || ds.bi === "") return c;
  const b = c.blocks[+ds.bi];
  if (!b) return null;
  if (ds.ri === undefined || ds.ri === "") return b;
  return b.rows ? b.rows[+ds.ri] : null;
}
const blockOf = ds => (state.cards[+ds.ci] || {blocks: []}).blocks[+ds.bi] || null;

let saveTimer = null;
function save(now){
  clearTimeout(saveTimer);
  const write = () => {
    try { localStorage.setItem(STORE, JSON.stringify({v:1, mode:state.mode, zooms:state.zooms, cards:state.cards})); }
    catch (e) { /* modo privado ou armazenamento cheio: segue sem salvar */ }
  };
  now ? write() : (saveTimer = setTimeout(write, 400));
}
function loadSaved(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && Array.isArray(d.cards) ? d : null;
  } catch (e) { return null; }
}
const commit = () => {
  render(); save(true);

};

function addRowAfter(ds){
  const b = blockOf(ds), ri = ds.ri === undefined ? b.rows.length - 1 : +ds.ri;
  const base = b.rows[ri];
  const nr = b.t === "skills"
    ? Object.assign(newRow(base ? base.c : "verde"), {mono: base ? base.mono : true})

  b.rows.splice(ri + 1, 0, nr);
  focusAfter = {ci: +ds.ci, bi: +ds.bi, ri: ri + 1, f: b.t === "skills" ? "sk" : "a"};
  commit();
}
function moveRow(ds, dir){
  const b = blockOf(ds), i = +ds.ri, j = i + dir;
  if (j < 0 || j >= b.rows.length) return;
  const [r] = b.rows.splice(i, 1);
  b.rows.splice(j, 0, r);
  focusAfter = {ci: +ds.ci, bi: +ds.bi, ri: j, f: b.t === "skills" ? "sk" : "a"};
  if (popCtx) popCtx.ds.ri = String(j);
  commit();
}
function moveItem(arr, i, dir){
  const j = i + dir;
  if (j < 0 || j >= arr.length) return false;
  const [x] = arr.splice(i, 1);
  arr.splice(j, 0, x);
  return true;
}
const NEWBLOCK = {skills: skillsBlock, mech: mechBlock, pair: pairBlock, text: textBlock, note: noteBlock};

/* ==========================================================================
   EXPORTACAO DE IMAGEM
   Cada cartao vira um SVG com <foreignObject>: o proprio HTML do cartao, o CSS
   desta pagina e as fontes convertidas em base64. As fontes precisam ir
   embutidas porque a imagem, depois de gerada, nao busca mais nada na rede —
   sem isso o arquivo sairia com fontes substitutas. O PNG e a rasterizacao
   desse mesmo SVG no tamanho pedido; o SVG e vetorial, sem perda em qualquer
   escala.
   ========================================================================== */
const FONT_CSS_URL = "https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap";
const GSTATIC = /https:\/\/fonts\.gstatic\.com[^)'"]+/g;
let fontCSS = null;
let imgOpt = {scale: 4, fmt: "png"};

function b64(buf){
  const bytes = new Uint8Array(buf);
  let out = "";
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(out);
}
async function fontsInline(){
  if (fontCSS !== null) return fontCSS;
  const embutido = document.getElementById("fontdata");
  if (embutido && embutido.textContent.indexOf("base64") > 0) return (fontCSS = embutido.textContent);
  try {
    const raw = await (await fetch(FONT_CSS_URL)).text();
    /* o Google devolve um @font-face por subset (cirilico, grego, vietnamita...);
       so latin e latin-ext interessam, e cortam o arquivo de 2,3 MB para ~500 KB */
    const blocos = raw.match(/\/\*[^*]*\*\/\s*@font-face\s*\{[^}]*\}/g) || [];
    const latinos = blocos.filter(b => /\/\*\s*latin(-ext)?\s*\*\//.test(b));
    const css = latinos.length ? latinos.join("\n") : raw;
    const urls = Array.from(new Set(css.match(GSTATIC) || []));
    const map = {};
    await Promise.all(urls.map(async u => {
      const r = await fetch(u);
      if (!r.ok) throw new Error(u);
      map[u] = "data:font/woff2;base64," + b64(await r.arrayBuffer());
    }));
    fontCSS = css.replace(GSTATIC, m => map[m] || m);
  } catch (e) {
    fontCSS = "";
  }
  return fontCSS;
}

/* medicao opcional: sem gtag (aberto do disco, bloqueador) vira no-op */
function evento(nome, dados){
  try { if (typeof gtag === "function") gtag("event", nome, dados || {}); } catch (e) {}
}

function slug(str){
  return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) || "cartao";
}

  return w > 200 ? w : 765;
}
async function cardSVG(ci, scale){
  const back = state.mode;
  state.mode = "read";
  const holder = document.createElement("div");
  holder.innerHTML = cardHTML(state.cards[ci], ci);
  state.mode = back;
  const card = holder.querySelector(".card");
  if (!card) throw new Error("cartão vazio");
  card.querySelectorAll(".gutter,.blk-tools,.card-tools,.addrow,.addblk").forEach(e => e.remove());
  const w = cardWidth(ci);
  const stage = document.createElement("div");
  stage.setAttribute("style", "position:fixed;left:-20000px;top:0;width:" + w + "px;visibility:hidden");
  stage.appendChild(card);
  document.body.appendChild(stage);
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  /* altura exata, sem arredondar: a sobra viraria faixa clara no rodape */
  const h = card.getBoundingClientRect().height;
  stage.remove();
  const css = (await fontsInline()) + "\n" + document.getElementById("appcss").textContent +
    "\n.card{box-shadow:none;height:" + h + "px}\n.gutter,.blk-tools,.card-tools,.addrow,.addblk{display:none}";
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (w * scale) +
    '" height="' + (h * scale) + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="none">' +
    "<style><![CDATA[" + css + "]]></style>" +
    '<foreignObject x="0" y="0" width="' + w + '" height="' + h + '">' +
    new XMLSerializer().serializeToString(card) + "</foreignObject></svg>";
  return {svg: svg, w: w, h: h};
}
async function rasterize(svg, W, H){
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error("o navegador não conseguiu rasterizar o cartão"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if (!blob) throw new Error("o PNG saiu vazio");
  return blob;
}
async function saveFile(filename, data){
  if (dlState === "none") throw new Error("este visualizador não permite salvar arquivos");
  if (dlSave) return dlSave.save({filename: filename, data: data});
  const blob = data instanceof Blob ? data : new Blob([data], {type: "application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return {status: "saved"};
}
let exporting = false;
async function exportCards(list){
  if (exporting) return;
  exporting = true;
  const total = list.length;
  let ok = 0, bad = 0, erro = "";
  try {
    toast(total > 1 ? "Preparando " + total + " cartões…" : "Preparando o cartão…");
    await fontsInline();
    for (let i = 0; i < total; i++){
      const c = state.cards[list[i]];
      toast("Gerando " + (i + 1) + " de " + total + "…");
      const nome = (c.num ? c.num.replace(/[^0-9a-zA-Z]/g, "") + "-" : "") + slug(c.title);
      try {
        if (imgOpt.fmt === "svg"){
          const r = await cardSVG(list[i], 1);
          await saveFile(nome + ".svg", new Blob([r.svg], {type: "image/svg+xml;charset=utf-8"}));
        } else {
          const r = await cardSVG(list[i], imgOpt.scale);
          await saveFile(nome + ".png", await rasterize(r.svg, Math.round(r.w * imgOpt.scale), Math.round(r.h * imgOpt.scale)));
        }
        ok++;
      } catch (e) {
        if (e && e.code === "declined"){ toast("Exportação cancelada.", 4000); return; }
        bad++;
        erro = (e && e.message) || String(e);
      }
    }
    if (ok) evento("exportar_imagem", {
      formato: imgOpt.fmt,
      escala: imgOpt.fmt === "png" ? imgOpt.scale : 1,
      quantidade: ok,
      falhas: bad
    });
    toast(ok === 0
      ? "Nada foi salvo — " + erro
      : (ok === 1 ? "1 arquivo salvo" : ok + " arquivos salvos") +
        (bad ? ", " + bad + " falharam (" + erro + ")" : "") +
        (fontCSS ? "." : " — sem internet para embutir as fontes, saiu com fontes substitutas."),
      9000);
  } finally {
    exporting = false;
  }
}
function imageModal(){
  const w = cardWidth(0), px = Math.round(w * imgOpt.scale), cm = (px / 300 * 2.54).toFixed(1);
  const n = state.cards.length;
  const btn = (k, v, rot, on) => '<button data-act="img-opt" data-k="' + k + '" data-v="' + v + '"' +
    (on ? ' class="on"' : "") + ">" + rot + "</button>";
  openModal("<h3>Exportar imagem</h3>" +
    "<p>Um arquivo por cartão, gerado como no Modo mesa e com as fontes embutidas.</p>" +
    '<h4>Formato</h4><div class="opt">' +
      btn("fmt", "png", "PNG", imgOpt.fmt === "png") +
      btn("fmt", "svg", "SVG vetorial", imgOpt.fmt === "svg") + "</div>" +
    (imgOpt.fmt === "png"
      ? '<h4>Resolução</h4><div class="opt">' +
          btn("scale", "2", "2× tela", imgOpt.scale === 2) +
          btn("scale", "4", "4× impressão", imgOpt.scale === 4) +
          btn("scale", "6", "6× máxima", imgOpt.scale === 6) + "</div>" +
        "<p>Saída de <b>" + px + " px</b> de largura: " + cm + " cm impressos a 300 DPI.</p>"
      : "<p>O SVG é vetorial: imprime nítido em qualquer tamanho e o texto continua sendo texto. " +
        "As fontes vão embutidas no arquivo.</p>") +
    '<div class="row"><button class="tb pri" data-act="img-all">Baixar ' +
      (n === 1 ? "o cartão" : "os " + n + " cartões") + "</button>" +
    '<button class="tb" data-act="close">Fechar</button></div>');
}


const ACTIONS = {
  /* ---- barra superior ---- */
  new(){ state.cards.push(TEMPLATES.poi.faz()); commit(); scrollToLast(); },
  templates(){ templatesModal(); },
  tpl(ds){ state.cards.push(TEMPLATES[ds.v].faz()); closeModal(); commit(); scrollToLast(); },
  mode(){ state.mode = state.mode === "read" ? "edit" : "read"; closePop(); commit(); },
  zoom(ds){
    const i = ZOOMS.indexOf(zoomAtual());
    state.zooms[state.mode] = ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, (i < 0 ? 1 : i) + (+ds.v)))];
    closePop(); commit();
  },
  img(){ imageModal(); },
  "img-opt"(ds){ imgOpt[ds.k] = ds.k === "scale" ? +ds.v : ds.v; imageModal(); },
  "img-all"(){ exportCards(state.cards.map((c, i) => i)); },
  export(){ exportModal(); },
  import(){ importModal(); },
  help(){ helpModal(); },
  close(){ closeModal(); },
  wipe(){
    if (!confirm("Apagar todos os cartões deste navegador? A ação não pode ser desfeita.")) return;
    state.cards = []; closeModal(); commit();
  },
  dl(){
    saveFile("pontos-de-interesse.json", new Blob([document.getElementById("exp").value], {type: "application/json"}))
      .then(() => evento("exportar_json", {acao: "baixar", cartoes: state.cards.length}))
      .catch(err => {
        if (err && err.code !== "declined") alert("Não consegui salvar o arquivo aqui. Use o botão Copiar.");
      });
  },
  copy(){
    evento("exportar_json", {acao: "copiar", cartoes: state.cards.length});
    const t = document.getElementById("exp");
    t.select();
    navigator.clipboard ? navigator.clipboard.writeText(t.value) : document.execCommand("copy");
  },
  "imp-add"(){ doImport(false); },
  "imp-replace"(){ doImport(true); },

  /* ---- cartao ---- */
  "card-opt"(ds, btn){ showPop("card", ds, btn); },
  "card-img"(ds){ exportCards([+ds.ci]); },
  "card-up"(ds){ if (moveItem(state.cards, +ds.ci, -1)) { closePop(); commit(); } },
  "card-down"(ds){ if (moveItem(state.cards, +ds.ci, 1)) { closePop(); commit(); } },
  "card-dup"(ds){
    const c = JSON.parse(JSON.stringify(state.cards[+ds.ci]));
    c.id = uid();
    state.cards.splice(+ds.ci + 1, 0, c);
    closePop(); commit();
  },
  "card-del"(ds){
    const c = state.cards[+ds.ci];
    if (!confirm('Excluir o cartão "' + (c.title || "sem título") + '"?')) return;
    state.cards.splice(+ds.ci, 1); closePop(); commit();
  },
  "card-acc"(ds){ nodeOf(ds).acc = ds.v; commit(); },
  "card-ico"(ds){ nodeOf(ds).ico = ds.v; commit(); },
  "card-tog"(ds){
    const c = nodeOf(ds);
    if (ds.v === "num") c.num = c.num ? "" : String(+ds.ci + 1).padStart(2, "0");
    if (ds.v === "tag") c.tag = c.tag ? "" : "[EVIDÊNCIA-CHAVE]";
    commit();
  },

  /* ---- blocos ---- */
  "blk-add"(ds){ state.cards[+ds.ci].blocks.push(NEWBLOCK[ds.type]()); commit(); },
  "blk-opt"(ds, btn){ showPop("blk", ds, btn); },
  "blk-up"(ds){ if (moveItem(state.cards[+ds.ci].blocks, +ds.bi, -1)) { closePop(); commit(); } },
  "blk-down"(ds){ if (moveItem(state.cards[+ds.ci].blocks, +ds.bi, 1)) { closePop(); commit(); } },
  "blk-del"(ds){ state.cards[+ds.ci].blocks.splice(+ds.bi, 1); closePop(); commit(); },
  "blk-color"(ds){ nodeOf(ds).c = ds.v; commit(); },
  "blk-colorall"(ds){ nodeOf(ds).rows.forEach(r => r.c = ds.v); commit(); },
  "blk-monoall"(ds){ const b = nodeOf(ds), on = !(b.rows[0] || {}).mono; b.rows.forEach(r => r.mono = on); commit(); },
  "blk-ico"(ds){ nodeOf(ds).ico = ds.v; commit(); },
  "blk-modo"(ds){ nodeOf(ds).modo = ds.v; commit(); },
  "blk-tog"(ds){
    const b = nodeOf(ds);
    if (ds.v === "banner") b.banner = b.banner === null ? "CONTEÚDO" : null;
    else if (ds.v === "tag") b.tag = b.tag ? "" : "HACK TÉCNICO";
    else if (ds.v === "note") b.note = b.note ? "" : "Observação curta sobre o desafio.";
    else b[ds.v] = !b[ds.v];
    commit();
  },

  /* ---- linhas ---- */
  "row-add"(ds){ addRowAfter(ds); },
  "row-append"(ds){ const b = blockOf(ds); addRowAfter({ci: ds.ci, bi: ds.bi, ri: String(b.rows.length - 1)}); },
  "row-del"(ds){ blockOf(ds).rows.splice(+ds.ri, 1); closePop(); commit(); },
  "row-opt"(ds, btn){ showPop("row", ds, btn); },
  "row-move"(ds){ moveRow(ds, +ds.v); },
  "row-color"(ds){ nodeOf(ds).c = ds.v; commit(); },
  "row-tog"(ds){ const r = nodeOf(ds); r[ds.v] = !r[ds.v]; commit(); },
  "row-skill"(ds){
    const r = nodeOf(ds);
    r.sk = ds.v;
    r.c = ds.c;
    closePop(); commit();
  }
};

function doImport(replace){
  const raw = document.getElementById("imp").value.trim();
  if (!raw) return alert("Cole o JSON ou escolha um arquivo antes.");
  let d;
  try { d = JSON.parse(raw); } catch (e) { return alert("Esse texto não é um JSON válido."); }
  const cards = Array.isArray(d) ? d : d.cards;
  if (!Array.isArray(cards)) return alert("Não encontrei uma lista de cartões nesse arquivo.");
  state.cards = replace ? cards : state.cards.concat(cards);
  state.cards.forEach(c => { if (!c.id) c.id = uid(); if (!Array.isArray(c.blocks)) c.blocks = []; });
  migrarIcones(state.cards);
  closeModal(); commit();
}
function scrollToLast(){
  const el = document.querySelectorAll(".wrap");
  if (el.length) el[el.length - 1].scrollIntoView({behavior: "smooth", block: "center"});
}

/* ==========================================================================
   EVENTOS
   ========================================================================== */
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn){
    if (!e.target.closest("#pop")) closePop();
    if (e.target === modal()) closeModal();
    return;
  }
  if (btn.tagName === "INPUT") return;   /* cor livre: resolvida no change */
  const act = ACTIONS[btn.dataset.act];
  if (!act) return;
  e.preventDefault();
  if (!btn.closest("#pop") && !btn.closest("#modal") && btn.dataset.act.slice(-4) !== "-opt") closePop();
  act(btn.dataset, btn);
});

const deck = document.getElementById("deck");
function guardaCampo(el){
  const node = nodeOf(el.dataset);
  if (!node) return;
  const f = el.dataset.f, val = sanitiza(el.innerHTML);
  if (/^h[01]$/.test(f) && Array.isArray(node.h)) node.h[+f.slice(1)] = val;
  else node[f] = val;
  save();
}
deck.addEventListener("input", e => {
  const el = e.target.closest("[data-f]");
  if (el && el.isContentEditable) guardaCampo(el);
});
deck.addEventListener("paste", e => {
  const el = e.target.closest("[data-f]");
  if (!el || !el.isContentEditable) return;
  e.preventDefault();
  const txt = ((e.clipboardData || window.clipboardData).getData("text/plain") || "").replace(/\r/g, "");
  document.execCommand("insertText", false, txt);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closePop(); closeModal(); return; }
  const el = e.target.closest ? e.target.closest("[data-f]") : null;
  if (!el || !el.isContentEditable || !e.altKey) return;
  const ds = el.dataset;
  if (ds.ri === undefined) return;
  if (e.key === "Enter"){ e.preventDefault(); addRowAfter(ds); }
  else if (e.key === "Backspace" || e.key === "Delete"){ e.preventDefault(); ACTIONS["row-del"](ds); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); moveRow(ds, -1); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); moveRow(ds, 1); }
});
/* ---------- barra de formatacao ----------
   Aparece ao selecionar texto dentro de um campo. Enquanto o mouse esta nela
   (inclusive com a paleta do sistema aberta) o alvo fica travado; sem isso a
   selecao perdida ao abrir o seletor de cor levaria a barra junto. */
const fmtEl = () => document.getElementById("fmt");
let fmtAlvo = null, fmtRange = null, fmtTrava = false;

function mostraFmt(){
  const bar = fmtEl();
  if (fmtTrava) return;
  const sel = window.getSelection();
  const no = sel && sel.rangeCount ? sel.anchorNode : null;
  const alvo = no && (no.nodeType === 1 ? no : no.parentElement);
  const campo = state.mode === "edit" && alvo && alvo.closest ? alvo.closest(".ed[contenteditable]") : null;
  if (!campo || sel.isCollapsed){ bar.classList.remove("on"); fmtAlvo = null; return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r.width && !r.height){ bar.classList.remove("on"); return; }
  fmtAlvo = campo;
  fmtRange = sel.getRangeAt(0).cloneRange();
  bar.classList.add("on");
  const larg = bar.offsetWidth;
  let x = r.left + window.scrollX + r.width / 2 - larg / 2;
  x = Math.max(8, Math.min(x, window.scrollX + document.documentElement.clientWidth - larg - 12));
  bar.style.left = x + "px";
  bar.style.top = Math.max(4, r.top + window.scrollY - bar.offsetHeight - 8) + "px";
}
function aplicaFmt(cmd, cor){
  if (!fmtAlvo || !fmtAlvo.isConnected) return;
  fmtAlvo.focus({preventScroll: true});
  if (fmtRange){
    const sel = window.getSelection();
    try { sel.removeAllRanges(); sel.addRange(fmtRange); } catch (e) {}
  }
  try { document.execCommand("styleWithCSS", false, true); } catch (e) {}
  if (cmd === "bold" || cmd === "italic") document.execCommand(cmd);
  else if (cmd === "mark") document.execCommand("hiliteColor", false, cor || "#bde06a");
  else if (cmd === "cor") document.execCommand("foreColor", false, cor || "#111111");
  else if (cmd === "limpar"){
    document.execCommand("removeFormat");
    document.execCommand("hiliteColor", false, "transparent");
  }
  guardaCampo(fmtAlvo);
  const s2 = window.getSelection();
  if (s2 && s2.rangeCount) fmtRange = s2.getRangeAt(0).cloneRange();
}
document.addEventListener("mousedown", e => {
  fmtTrava = !!(e.target.closest && e.target.closest("#fmt"));
}, true);
document.addEventListener("selectionchange", mostraFmt);
fmtEl().addEventListener("mousedown", e => {
  const b = e.target.closest("[data-fmt]");
  if (!b) return;
  e.preventDefault();   /* mantem a selecao no campo */
  aplicaFmt(b.dataset.fmt, b.dataset.cor);
});
document.getElementById("fmtcor").addEventListener("change", e => {
  aplicaFmt("mark", e.target.value);
  fmtTrava = false;
});
document.getElementById("fmttxt").addEventListener("change", e => {
  aplicaFmt("cor", e.target.value);
  fmtTrava = false;
});
window.addEventListener("resize", () => { if (popCtx) closePop(); fmtEl().classList.remove("on"); encaixe(); });

(function init(){
  const saved = loadSaved();
  if (saved){
    state.cards = saved.cards;
    state.mode = saved.mode === "read" ? "read" : "edit";
    if (saved.zooms) ["edit", "read"].forEach(m => {
      if (ZOOMS.indexOf(saved.zooms[m]) >= 0) state.zooms[m] = saved.zooms[m];
    });
    else if (ZOOMS.indexOf(saved.zoom) >= 0) state.zooms.edit = saved.zoom;   /* formato antigo */
    migrarIcones(state.cards);
  } else {
    state.cards = [demoCard()];
  }
  render();
})();
